name: aslattara
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_localization: ^0.4.0
  flutter_screenutil: ^5.9.3
  flutter_launcher_icons: ^0.14.4
  go_router: ^17.2.3
  device_preview: ^1.3.1
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true

  assets:
    - assets/images/
    - lib/features/dashboard/presentation/widgets/

  fonts:
    - family: IBMPlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Thin.ttf
          weight: 100

        - asset: assets/fonts/IBMPlexSansArabic-ExtraLight.ttf
          weight: 200

        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300

        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400

        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500

        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"